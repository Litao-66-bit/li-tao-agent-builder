<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Builder</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 顶栏：六阶段状态机 -->
  <header class="topbar">
    <div class="topbar-title">🧭 Agent Builder</div>
    <nav class="stage-bar" id="stageBar">
      <span class="stage">需求</span>
      <span class="stage">计划</span>
      <span class="stage">确认</span>
      <span class="stage">执行</span>
      <span class="stage">验证</span>
      <span class="stage">汇报</span>
    </nav>
  </header>

  <!-- 主体三栏 -->
  <div class="main">

    <!-- 左栏：技能 / 插件 / 新建项目 -->
    <aside class="sidebar-left">
      <div class="panel">
        <div class="panel-title">🔧 技能</div>
        <div class="skill-row">
          <span class="skill-label">文件读写</span>
          <label class="toggle">
            <input type="checkbox" checked>
            <span class="toggle-track"></span>
          </label>
        </div>
        <div class="skill-row">
          <span class="skill-label">联网搜索</span>
          <label class="toggle">
            <input type="checkbox">
            <span class="toggle-track"></span>
          </label>
        </div>
        <div class="skill-row">
          <span class="skill-label">命令执行 <span class="warn-badge" title="高风险操作，需审批">⚠</span></span>
          <label class="toggle">
            <input type="checkbox">
            <span class="toggle-track"></span>
          </label>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">🧩 插件</div>
        <div class="plugin-item">· 海报生成</div>
        <div class="plugin-item">· 网页抓取</div>
        <div class="plugin-item">· Git 集成</div>
        <div class="plugin-add">＋ 添加插件</div>
      </div>

      <div class="new-project-btn">
        <div class="big">＋ 新建项目</div>
        <div class="sub">从需求开始构建 Agent</div>
      </div>
    </aside>

    <!-- 中栏：对话区（动态渲染） -->
    <main class="chat-area" id="chatArea">
      <!-- 消息由 JS 动态插入 -->
    </main>

    <!-- 右栏：文件框 -->
    <aside class="sidebar-right">
      <div class="file-header">
        <span class="file-title">📁 工作区文件</span>
        <span class="file-refresh-btn" title="重新拉取工作区文件树">↻ 刷新</span>
      </div>
      <div class="file-path">工作区 / workspace</div>

      <div class="file-tree">
        <div class="tree-node depth-0">⟳ 加载中…</div>
      </div>

      <!-- 选择本地文件：仅在前端读取预览，不上传后端 -->
      <div class="local-file-bar">
        <button type="button" class="local-file-btn" id="localFileBtn">＋ 选择本地文件</button>
        <input type="file" id="localFileInput" hidden>
      </div>

      <div class="file-preview" id="filePreview">
        <span class="label">文件预览</span>：点击文件树中的文件查看内容
      </div>
    </aside>

  </div>

  <!-- 只读文件查看器：点击文件树中的文件打开（Esc / 点遮罩 / 关闭按钮 关闭） -->
  <div class="file-viewer" id="fileViewer" hidden>
    <div class="file-viewer-mask" data-close="1"></div>
    <div class="file-viewer-panel" role="dialog" aria-modal="true" aria-labelledby="fileViewerPath">
      <div class="file-viewer-head">
        <span class="file-viewer-path" id="fileViewerPath">—</span>
        <span class="file-viewer-meta" id="fileViewerMeta"></span>
        <span class="file-viewer-dirty" id="fileViewerDirty" hidden>● 未保存</span>
        <button type="button" class="key-btn" id="fileViewerDownload" hidden>另存为</button>
        <button type="button" class="key-btn" id="fileViewerSave" hidden>保存</button>
        <button type="button" class="key-btn" id="fileViewerClose">关闭</button>
      </div>
      <textarea class="file-viewer-body" id="fileViewerBody" spellcheck="false" wrap="off"></textarea>
    </div>
  </div>

  <!-- 底部：模型设置 + 输入 -->
  <footer class="bottom-bar">
    <div class="model-settings">
      <div class="setting-chip">
        模型
        <select id="modelSelect">
          <option>deepseek-chat</option>
          <option>deepseek-reasoner</option>
          <option>gpt-4o</option>
        </select>
        <span style="color:#2da44e;">✓</span>
      </div>
      <div class="setting-chip slider-wrap">
        推理强度
        <span class="slider-value" id="tempValue">0.7</span>
        <input type="range" id="tempSlider" min="0" max="1" step="0.1" value="0.7">
      </div>
      <!-- 高级：可选下拉（前端占位，待后端字段接入后生效） -->
      <div class="setting-chip" title="高级执行选项（当前为前端占位，待后端字段接入）">
        高级
        <select id="advancedSelect">
          <option value="default">默认</option>
          <option value="detailed">详细</option>
          <option value="concise">精简</option>
        </select>
      </div>
      <!-- API 密钥：未配置时显示输入框；配置后只显示掩码 + 删除按钮，永不回显明文 -->
      <div class="setting-chip key-chip" id="apiKeyInputChip">
        <span class="key-display">⚿</span>
        <input type="password" id="apiKeyInput" class="key-input" placeholder="输入 API 密钥"
               autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="API 密钥">
        <button type="button" class="key-btn" id="apiKeySave">保存</button>
      </div>
      <div class="setting-chip" id="apiKeyStatusChip" hidden>
        <span class="key-display">⚿ 已保存 <span id="apiKeyMasked">—</span></span>
        <button type="button" class="key-btn key-btn-danger" id="apiKeyDelete">删除密钥</button>
      </div>
      <div class="setting-chip">
        <label class="toggle">
          <input type="checkbox" id="llmToggle">
          <span class="toggle-track"></span>
        </label>
        LLM 拆分
      </div>
      <div class="setting-chip" title="开启后副结构将进行自我检测与更新">
        <label class="toggle">
          <input type="checkbox" id="selfCheckToggle">
          <span class="toggle-track"></span>
        </label>
        副结构自检
      </div>
    </div>

    <div class="input-row">
      <input type="text" class="msg-input" id="msgInput" placeholder="输入你的需求…（Enter 发送 / Shift+Enter 换行）">
      <button class="btn-secondary" id="interruptBtn">⏸ 中断</button>
      <button class="btn-send" id="sendBtn">发送 ➤</button>
    </div>
  </footer>

  <!-- 先加载 API 封装层，再加载业务逻辑 -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
